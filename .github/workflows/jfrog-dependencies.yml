
name: JFrog dependency resolution

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Juice Shop
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Verify JFrog connection
        run: jf rt ping

      - name: Configure npm resolution through Artifactory
        run: |
          jf npm-config \
            --server-id-resolve=setup-jfrog-cli-server \
            --repo-resolve=npm-virtual

      - name: Configure frontend npm resolution
        run: |
          cd frontend
          jf npm-config \
            --server-id-resolve=setup-jfrog-cli-server \
            --repo-resolve=npm-virtual
          cd ..

      - name: Verify frontend npm registry
        run: |
          cd frontend
          npm config get registry
          npm config get userconfig
          cd ..

      - name: Verify npm registry
        run: |
          npm config get registry
          jf npm-config --help


      - name: Install root dependencies through JFrog
        run: |
          jf npm ci --ignore-scripts \
            --build-name=juice-shop \
            --build-number=${{ github.run_number }}

      - name: Install frontend dependencies through JFrog
        run: |
          cd frontend
          jf npm install --legacy-peer-deps --ignore-scripts \
            --build-name=juice-shop \
            --build-number=${{ github.run_number }}
          cd ..

      - name: Build Juice Shop
        run: |
          npm run build:frontend
          npx --yes --package typescript@4.8.4 tsc --strictNullChecks false

      - name: Show available npm scripts
        run: npm run

      - name: Run existing tests
        run: jf npm test

      - name: Publish Build Info to JFrog
        run: |
          jf rt build-publish juice-shop ${{ github.run_number }}